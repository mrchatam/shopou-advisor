name: Connector problem / مشکل کانکتور
description: It would not connect, sign-in failed, a tool errored, or an answer was clearly wrong / وصل نشد، ورود شکست خورد یا پاسخ اشتباه بود
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The connector is read-only, so
        it cannot have changed an order, a price or anything in your Digikala
        account.

        ممنون که گزارش می‌دهید. این کانکتور فقط می‌خواند و نمی‌تواند سفارش، قیمت یا
        چیزی را در حساب دیجی‌کالای شما تغییر دهد. به فارسی هم می‌توانید بنویسید.

        **Do not include access tokens, refresh tokens, passwords or personal
        information** — توکن، گذرواژه یا اطلاعات شخصی را ننویسید. Nothing in a
        report needs them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / چه اتفاقی افتاد؟
      description: What did you expect, and what did you get instead? / چه انتظاری داشتید و چه چیزی دیدید؟
      placeholder: I asked for ..., and the answer said ...
    validations:
      required: true

  - type: textarea
    id: asked
    attributes:
      label: What did you ask? / چه پرسیدید؟
      description: Paste the message you sent, in the words you used. / همان جمله‌ای را که فرستادید بگذارید.
      render: text
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did it happen? / کجا رخ داد؟
      options:
        - The connector inside ChatGPT / کانکتور در ChatGPT
        - A direct MCP client (curl, Inspector, another app) / کلاینت مستقیم MCP
        - The public website / وب‌سایت
    validations:
      required: true

  - type: input
    id: when
    attributes:
      label: When did it happen? / چه زمانی؟
      description: Local date and time with the timezone, and whether it happens every time or only once. / تاریخ و ساعت محلی با منطقهٔ زمانی.
      placeholder: 2026-10-23 21:15 IRST, happens every time
    validations:
      required: true

  - type: input
    id: correlation-id
    attributes:
      label: Correlation id (optional) / شناسهٔ همبستگی (اختیاری)
      description: Only when you call the service directly. It is the x-correlation-id response header. / فقط برای کلاینت مستقیم؛ هدر پاسخ x-correlation-id.
      placeholder: 1f0c9a2b7d4e6f83

  - type: textarea
    id: more
    attributes:
      label: Anything else? / نکتهٔ دیگر
      description: The exact error text, a screenshot with tokens hidden, or a link to the question. / متن دقیق خطا یا عکسی که توکن در آن نیست.
    validations:
      required: false
