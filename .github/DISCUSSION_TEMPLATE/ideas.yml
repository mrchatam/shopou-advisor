title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        An idea is easier to judge when it starts from a purchase that did not go
        well. What were you trying to buy, and what did the answer leave out?

        ایده وقتی بهتر سنجیده می‌شود که از یک خرید واقعی شروع شود: چه چیزی
        می‌خواستید بخرید و پاسخ چه چیزی را کم داشت؟

        The connector reads listings and plans a set; it never adds to a cart,
        checks out or places an order. Ideas that need an account, a saved basket
        or a purchase cannot be built here.

  - type: textarea
    id: idea
    attributes:
      label: The idea / ایده
      description: What should it do that it does not do today? / چه کاری باید بکند که امروز نمی‌کند؟
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve? / چه مشکلی را حل می‌کند؟
      description: The purchase or question where this came up. / خریدی که این ایده از آن درآمد.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do instead today? (optional) / امروز به‌جایش چه می‌کنید؟ (اختیاری)
    validations:
      required: false
